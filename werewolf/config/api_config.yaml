# Qwen API Configuration
# See: https://help.aliyun.com/zh/model-studio/getting-started/models
#
# Deep thinking (深度思考): 通过 extra_body={"enable_thinking": True} 开启
# 支持思考模式的模型: qwen-plus, qwen-max, qwen-turbo, qwen-flash 等
# 思考预算: thinking_budget 限制推理 token 数
# 传递思考: preserve_thinking 在多轮对话中保留推理历史

qwen:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${QWEN_API_KEY}"
  model: "qwen3.7-plus"     # 可在 Web UI 中自定义模型名；支持思考模式的模型: qwen-plus, qwen3.7-plus 等
  max_tokens: 2048
  temperature: 1.0
  # enable_thinking: true     # 通过 game_config.yaml 中的 deep_thinking 控制，或 CLI --thinking
  # thinking_budget: 2048      # 限制推理最大 token 数，0=不限制

# DeepSeek API Configuration
# See: https://api.deepseek.com/api-docs

deepseek:
  base_url: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-flash"  # 可在 Web UI 中自定义模型名
  max_tokens: 2048
  temperature: 1.0
  reasoning_effort: "high"  # "high" or "max" for deep thinking mode
