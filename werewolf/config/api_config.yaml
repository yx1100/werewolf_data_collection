# Qwen API Configuration
# See: https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-chat-completions
#
# 使用 Chat Completions API (/v1/chat/completions)，非 Responses API。
# 深度思考: extra_body={"enable_thinking": True/False}（布尔开关）
# Qwen 不使用 reasoning_effort（那是 DeepSeek 模型的参数）。
# 思考预算: extra_body={"thinking_budget": N}（0=不限制）
# 保留思考: extra_body={"preserve_thinking": True}（默认 False）
# 注意: 思考模式下不支持结构化输出（response_format），代码中自动跳过。
#
# base_url 迁移提示: 华北2(北京) 已从 dashscope.aliyuncs.com 迁移至
# {WorkspaceId}.cn-beijing.maas.aliyuncs.com，旧 URL 暂仍可用。

qwen:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${QWEN_API_KEY}"
  model: "qwen3.7-plus"     # 可在 Web UI 中自定义模型名
  max_tokens: 2048
  temperature: 1.0
  top_p: 0.95
  # reasoning_effort 不再使用 — Qwen 通过 enable_thinking 布尔开关控制

# DeepSeek API Configuration
# See: https://api.deepseek.com/api-docs

deepseek:
  base_url: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-flash"  # 可在 Web UI 中自定义模型名
  max_tokens: 2048
  temperature: 1.0
  top_p: 1.0               # 核采样参数，与 temperature 配合控制生成多样性
  reasoning_effort: "high"  # "high" or "max" for deep thinking mode

# MiMo API Configuration
# See: https://mimo.mi.com/docs/zh-CN/api/chat/openai-api
#
# 使用 Chat Completions API (/v1/chat/completions)，非 Responses API。
# 认证: api-key header + Bearer（双重，SDK 已自动处理）
# 深度思考: extra_body={"thinking": {"type": "enabled"/"disabled"}}（二元开关）
# 不支持 reasoning_effort 参数 — 思考强度不可调节。
# 结构化输出使用标准 response_format={"type": "json_object"}。

mimo:
  base_url: "https://api.xiaomimimo.com/v1"
  api_key: "${MIMO_API_KEY}"
  model: "mimo-v2.5-pro"  # 可在 Web UI 中自定义模型名; 可选: mimo-v2.5-pro, mimo-v2.5
  max_tokens: 2048
  temperature: 1.0
  top_p: 0.95
  # reasoning_effort 不再使用 — MiMo Chat Completions API 通过 thinking.type 二元开关控制
