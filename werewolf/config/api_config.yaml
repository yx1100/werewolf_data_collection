# Qwen API Configuration
# See: https://help.aliyun.com/zh/model-studio/qwen-api-via-openai-responses
#
# 使用 Responses API (/v1/responses)，非 Chat Completions API。
# 深度思考: reasoning={"effort": "high"}（top-level），可选 minimal/low/medium/high
# 系统指令通过 input 中的 {"role": "system"} 传递（非 instructions 参数）
# 注意: enable_thinking / thinking_budget / preserve_thinking 已不再使用

qwen:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${QWEN_API_KEY}"
  model: "qwen3.7-plus"     # 可在 Web UI 中自定义模型名
  max_tokens: 2048
  temperature: 1.0
  reasoning_effort: "high"  # minimal/low/medium/high，深度思考时的推理强度

# DeepSeek API Configuration
# See: https://api.deepseek.com/api-docs

deepseek:
  base_url: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-v4-flash"  # 可在 Web UI 中自定义模型名
  max_tokens: 2048
  temperature: 1.0
  reasoning_effort: "high"  # "high" or "max" for deep thinking mode

# MiMo API Configuration
# See: https://mimo.mi.com/docs/zh-CN/quick-start/summary/first-api-call
#
# MiMo 使用 api-key header 认证（非标准 Bearer token），SDK 已自动处理。
# 深度思考: thinking:{type:"enabled"/"disabled"} 通过 extra_body 控制
#   - mimo-v2.5-pro / mimo-v2.5 默认开启深度思考，关闭时显式发送 disabled
#   - 深度思考开启时 temperature 和 top_p 不可自定义（SDK 自动跳过）
# 注意: MiMo 不支持 reasoning_effort 参数

mimo:
  base_url: "https://api.xiaomimimo.com/v1"
  api_key: "${MIMO_API_KEY}"
  model: "mimo-v2.5-pro"  # 可在 Web UI 中自定义模型名; 可选: mimo-v2.5-pro, mimo-v2.5
  max_tokens: 2048
  temperature: 1.0
