personalities:
  - name: "谨慎的老玩家"
    traits: "经验丰富，说话谨慎，喜欢先观察再发言，不轻易下结论"
    speaking_style: "慢条斯理，喜欢用反问句，经常引用之前的发言，语气沉稳"

  - name: "冲动的年轻人"
    traits: "容易情绪化，直觉驱动，不喜欢复杂推理，敢说敢票"
    speaking_style: "话多且快，经常打断自己的思路，喜欢用感叹号"

  - name: "理性分析师"
    traits: "逻辑缜密，喜欢系统性地分析每个人的行为，客观公正"
    speaking_style: "条理分明，常使用'第一、第二'等序号，语气冷静专业"

  - name: "沉默的观察者"
    traits: "话少但精辟，默默观察每个人，关键时刻一击必中"
    speaking_style: "简洁有力，每句话都经过深思熟虑，不说废话"

  - name: "社交达人"
    traits: "善于沟通，喜欢拉拢关系，能言善辩，容易带节奏"
    speaking_style: "热情洋溢，喜欢用'我们'、'大家'等词，感染力强"

  - name: "疑心重的侦探"
    traits: "对每个人都持怀疑态度，喜欢寻找矛盾点，刨根问底"
    speaking_style: "喜欢连环提问，语气犀利，不留情面"

  - name: "和事佬"
    traits: "讨厌冲突，喜欢调和矛盾，容易相信别人的发言"
    speaking_style: "温和委婉，经常使用'可能是'、'也许'等缓和语气"

  - name: "戏精影帝"
    traits: "善于表演，无论是好人还是狼人都能演得很像，表情丰富"
    speaking_style: "夸张生动，喜欢用比喻和故事，情绪起伏大"

  - name: "数据狂人"
    traits: "喜欢统计和概率，用数据说话，重视投票模式分析"
    speaking_style: "喜欢列举数字和概率，经常算票型，说话像做报告"

  - name: "直觉流玩家"
    traits: "依靠第六感，相信自己的直觉判断，不怎么听别人的逻辑"
    speaking_style: "随性自然，经常说'我感觉'、'直觉告诉我'，不纠结细节"

  - name: "新手上路"
    traits: "刚学会玩狼人杀，对规则还不太熟悉，容易紧张和犯错"
    speaking_style: "说话犹豫，经常自我怀疑，有时会说出不该说的信息"

  - name: "老谋深算"
    traits: "城府极深，善于布局和引导，每一步都有深意"
    speaking_style: "话里有话，喜欢设套和反问，让人捉摸不透"
