<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 — 狼人杀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #010102; color: #f7f8f8; min-height: 100vh; -webkit-font-smoothing: antialiased; line-height: 1.5; }
        .container { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
        .back-link { margin-bottom: 24px; display: inline-block; color: #8a8f98; text-decoration: none; font-size: 0.875rem; transition: color 0.15s; }
        .back-link:hover { color: #f7f8f8; }
        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 24px; }
        .card { background: #0f1011; border-radius: 12px; padding: 24px; border: 1px solid #23252a; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 12px; text-align: left; border-bottom: 1px solid #23252a; }
        th { color: #8a8f98; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { color: #d0d6e0; font-size: 0.875rem; }
        .winner-good { color: #27a644; font-weight: 500; }
        .winner-werewolf { color: #e94560; font-weight: 500; }
        .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #23252a; cursor: pointer; font-size: 0.8125rem; font-weight: 500; font-family: 'Inter', sans-serif; text-decoration: none; display: inline-block; background: #141516; color: #d0d6e0; transition: all 0.15s; }
        .btn:hover { border-color: #5e6ad2; color: #f7f8f8; }
        .btn-danger { background: transparent; color: #e94560; border: 1px solid #23252a; }
        .btn-danger:hover { background: rgba(233,69,96,0.08); border-color: #e94560; }
        .empty { text-align: center; color: #8a8f98; padding: 40px; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 返回大厅</a>
        <h1>📋 历史游戏记录</h1>
        <div class="card">
            {% if games %}
            <table>
                <thead><tr><th>游戏 ID</th><th>时间</th><th>API</th><th>轮数</th><th>结果</th><th>操作</th></tr></thead>
                <tbody>
                {% for g in games %}
                <tr>
                    <td>{{ g.game_id }}</td>
                    <td>{{ g.display_time }}</td>
                    <td>{{ g.api_provider }}</td>
                    <td>{{ g.rounds }}</td>
                    <td class="{% if g.winner == 'good' %}winner-good{% else %}winner-werewolf{% endif %}">
                        {% if g.winner == 'good' %}好人胜{% else %}狼人胜{% endif %}
                    </td>
                    <td><a href="/game/{{ g.game_id }}/data" class="btn">查看数据</a>
                        <button class="btn btn-danger" onclick="deleteGame('{{ g.game_id }}')">删除</button></td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p class="empty">暂无已完成游戏</p>
            {% endif %}
        </div>
    </div>

    <script>
    async function deleteGame(gameId) {
        if (!confirm('确定要删除游戏 ' + gameId + ' 的数据吗？此操作不可撤销。')) return;
        try {
            const resp = await fetch('/game/' + gameId + '/data', { method: 'DELETE' });
            const result = await resp.json();
            if (result.status === 'deleted') {
                location.reload();
            } else {
                alert('删除失败: ' + JSON.stringify(result));
            }
        } catch (err) {
            alert('删除失败: ' + err.message);
        }
    }
    </script>
</body>
</html>
